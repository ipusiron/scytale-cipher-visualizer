<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="referrer" content="no-referrer" />
    <title>スキュタレー暗号ビジュアライザー - Scytale Cipher Visualizer</title>
    <meta
      name="description"
      content="古代スパルタで使われたスキュタレー暗号を視覚的に学習できる教育ツール"
    />
    <meta
      name="keywords"
      content="暗号, 古典暗号, スキュタレー, 教育, セキュリティ, IPUSIRON"
    />
    <meta name="author" content="IPUSIRON" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <noscript>このツールを使うにはJavaScriptを有効にしてください。 / This tool requires JavaScript.</noscript>
    <div class="container">
      <div class="header">
        <h1><span data-i18n="app.h1"></span><br><span data-i18n="app.h1sub"></span></h1>
        <div class="subtitle" data-i18n="app.subtitle"></div>
        <button id="langToggle" class="lang-toggle" type="button"
          data-i18n="app.langButton" data-i18n-aria-label="app.langAria">English</button>
        <button id="themeToggleBtn" class="theme-toggle" aria-label="ダークモードに切り替える" aria-pressed="false">🌙</button>
      </div>

      <div class="info-panel">
        <h2 data-i18n="intro.heading"></h2>
        <p>
          <span data-i18n="intro.line1"></span><br>
          <strong data-i18n="intro.strong"></strong><span data-i18n="intro.line2"></span>
        </p>
      </div>

      <!-- タブナビゲーション -->
      <div class="tab-navigation" role="tablist" data-i18n-aria-label="tabs.aria">
        <button class="tab-btn active" id="encryptTab" data-tab="encrypt"
          role="tab" aria-selected="true" aria-controls="encryptContent" data-i18n="tab.encrypt"></button>
        <button class="tab-btn" id="decryptTab" data-tab="decrypt"
          role="tab" aria-selected="false" aria-controls="decryptContent" tabindex="-1" data-i18n="tab.decrypt"></button>
      </div>

      <!-- 暗号化タブ -->
      <div class="tab-content active" id="encryptContent" role="tabpanel" aria-labelledby="encryptTab">
        <div class="controls">
          <div class="input-group">
            <label for="encryptInputText" data-i18n="encrypt.textLabel"></label>
            <textarea
              id="encryptInputText"
              data-i18n-placeholder="encrypt.placeholder"
            ></textarea>
            <small id="encryptCharCount" class="input-hint" aria-live="polite"></small>
          </div>
          <div class="input-group">
            <label for="encryptRows" data-i18n="rows.label"></label>
            <input type="number" id="encryptRows" min="2" max="10" value="3" />
            <small class="input-hint" data-i18n="encrypt.rowsHint"></small>
          </div>
          <div class="input-group">
            <label for="fillPadding" data-i18n="padding.label"></label>
            <div class="checkbox-wrapper">
              <input type="checkbox" id="fillPadding" />
              <label for="fillPadding" class="checkbox-label" data-i18n="padding.checkbox"></label>
            </div>
          </div>
          <div class="input-group execute-group">
            <button class="execute-btn" id="encryptExecuteBtn" data-i18n="encrypt.run"></button>
          </div>
        </div>
      </div>

      <!-- 復号タブ -->
      <div class="tab-content" id="decryptContent" role="tabpanel" aria-labelledby="decryptTab" hidden>
        <div class="controls">
          <div class="input-group">
            <label for="decryptInputText" data-i18n="decrypt.textLabel"></label>
            <textarea
              id="decryptInputText"
              data-i18n-placeholder="decrypt.placeholder"
            ></textarea>
            <small id="decryptCharCount" class="input-hint" aria-live="polite"></small>
          </div>
          <div class="input-group">
            <label for="decryptRows" data-i18n="rows.label"></label>
            <input type="number" id="decryptRows" min="2" max="10" value="3" />
            <small class="input-hint" data-i18n="decrypt.rowsHint"></small>
          </div>
          <div class="input-group sync-group">
            <span class="control-label" data-i18n="sync.label"></span>
            <button class="sync-btn" id="syncCipherBtn" data-i18n="sync.button"></button>
            <small class="input-hint" data-i18n="sync.hint"></small>
          </div>
          <div class="input-group execute-group">
            <button class="execute-btn" id="decryptExecuteBtn" data-i18n="decrypt.run"></button>
          </div>
        </div>
        <button id="bruteForceBtn" class="execute-btn" data-i18n="brute.button"></button>
        <div id="bruteForceResults" class="brute-force-results" aria-live="polite"></div>
      </div>

      <p id="operationMessage" class="operation-message" role="status" aria-live="polite"></p>

      <div class="scytale-visual">
        <div class="scytale-rod" id="scytaleRod">
          <div class="scytale-band" id="scytaleBand"></div>
          <div class="scytale-text" id="scytaleText"></div>
        </div>
        <div class="scytale-info">
          <div id="scytaleStatus" aria-live="polite"></div>
        </div>
      </div>

      <div class="visualization">
        <h2 class="section-title" data-i18n="matrix.heading"></h2>
        <div class="matrix-container">
          <div id="matrixDisplay">
            <p class="matrix-description" data-i18n="matrix.empty"></p>
          </div>
        </div>
      </div>

      <div class="result-container">
        <p id="identityWarning" class="identity-warning" aria-live="polite"></p>
        <div class="result-heading">
          <h2 class="section-title" data-i18n="result.heading"></h2>
          <button
            id="copyBtn"
            class="copy-btn"
            hidden
          >
            <span id="copyIcon" aria-hidden="true">📋</span> <span id="copyLabel"></span>
          </button>
        </div>
        <div id="resultText" class="result-text" aria-live="polite"></div>
      </div>

      <h2 class="section-title" data-i18n="algo.heading"></h2>
      <div class="algorithm-info">
        <div class="algorithm-step">
          <h3 data-i18n="algo.encryptHeading"></h3>
          <ol>
            <li data-i18n="algo.encrypt1"></li>
            <li data-i18n="algo.encrypt2"></li>
            <li data-i18n="algo.encrypt3"></li>
          </ol>
        </div>
        <div class="algorithm-step">
          <h3 data-i18n="algo.decryptHeading"></h3>
          <ol>
            <li data-i18n="algo.decrypt1"></li>
            <li data-i18n="algo.decrypt2"></li>
            <li data-i18n="algo.decrypt3"></li>
          </ol>
        </div>
      </div>

      <footer class="footer">
        <p>
          Created by
          <a href="https://akademeia.info/" target="_blank" rel="noopener noreferrer">IPUSIRON</a> |
          <a
            href="https://github.com/ipusiron/scytale-cipher-visualizer"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </p>
      </footer>
    </div>

    <script src="js/i18n.js" defer></script>
    <script src="js/scytale-logic.js" defer></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
